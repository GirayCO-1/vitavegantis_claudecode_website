# VitaVegantis içerik paneli.
# Panelde yapılan her kayıt GitHub deposuna işlenir; Vercel siteyi 1-2 dakika
# içinde yeniden yayınlar. Ayrı bir veritabanı yoktur.

# Giriş: panelde "Erişim Token'ı Kullanarak Giriş Yap" seçeneği kullanılır.
# Açılan pencere, gerekli izinleri önceden seçilmiş bir GitHub token
# oluşturma bağlantısı verir; üretilen anahtar yapıştırılır.
#
# Üstteki "GitHub ile Giriş Yap" düğmesi ÇALIŞMAZ: OAuth sunucu tarafı kod
# gerektiriyor, statik yayında (IHS) böyle bir şey mümkün değil. Token
# yöntemi ise hem Vercel'de hem IHS'de aynı şekilde çalışıyor.
backend:
  name: github
  repo: GirayCO-1/vitavegantis_claudecode_website
  branch: main

# Yüklenen görseller doğrudan depoya gider.
media_folder: public/uploads
public_folder: /uploads

locale: tr

collections:
  # ---------------------------------------------------------------- Blog (TR)
  - name: blog_tr
    label: Blog Yazıları (Türkçe)
    label_singular: Blog Yazısı
    folder: src/content/blog
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    media_folder: /public/blog
    public_folder: /blog
    summary: "{{title}}"
    description: >-
      Yazının dosya adı aynı zamanda yayın adresidir
      (ör. veganlik-nedir → vitavegantis.com/veganlik-nedir/).
      Yayındaki bir yazının adını değiştirmeyin — arama motorundaki yeri kaybolur.
    fields:
      - { name: title, label: Başlık, widget: string }
      - name: seoTitle
        label: Kısa başlık (Google için)
        widget: string
        required: false
        hint: >-
          Başlık 45 karakterden uzunsa doldurun. Arama sonucunda bu görünür,
          sayfada yine uzun başlık kalır.
      - name: description
        label: Özet
        widget: text
        hint: Blog listesinde ve Google'da görünen açıklama. 120-160 karakter idealdir.
      - { name: image, label: Kapak görseli, widget: image }
      - name: date
        label: Yayın tarihi
        widget: datetime
        required: false
        date_format: DD.MM.YYYY
        time_format: false
        picker_utc: true
        hint: Yeni yazılar listenin başında, tarihe göre sıralanır.
      - { name: body, label: Yazı, widget: markdown }

  # ---------------------------------------------------------------- Blog (EN)
  - name: blog_en
    label: Blog Yazıları (İngilizce)
    label_singular: Blog Yazısı (EN)
    folder: src/content/blog/en
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    media_folder: /public/blog
    public_folder: /blog
    summary: "{{title}}"
    description: >-
      Türkçe yazının İngilizce karşılığı. Dosya adı Türkçesiyle birebir aynı
      olmalı — iki dil bu isim üzerinden eşleşiyor.
    fields:
      - { name: title, label: Başlık (EN), widget: string }
      - { name: seoTitle, label: Kısa başlık (EN), widget: string, required: false }
      - { name: description, label: Özet (EN), widget: text }
      - { name: image, label: Kapak görseli, widget: image }
      - name: date
        label: Yayın tarihi
        widget: datetime
        required: false
        date_format: DD.MM.YYYY
        time_format: false
        picker_utc: true
      - { name: body, label: Yazı (EN), widget: markdown }

  # ------------------------------------------------------------------ Tarifler
  - name: recipes
    label: Tarifler
    label_singular: Tarif
    folder: src/content/recipes
    extension: json
    create: true
    slug: "{{slug}}"
    media_folder: /public/recipes
    public_folder: /recipes
    summary: "{{title}}"
    description: >-
      Her tarif hem Türkçe hem İngilizce alanları içerir. Yayın adresi
      "Yayın adresi" alanından gelir; yayındaki bir tarifte bunu değiştirmeyin.
    fields:
      - name: order
        label: Sıra
        widget: number
        value_type: int
        default: 10
        hint: Küçük sayı önce görünür.
      - name: urlSlug
        label: Yayın adresi
        widget: string
        pattern: ['^[a-z0-9-]+$', 'Yalnızca küçük harf, rakam ve tire kullanın']
        hint: "Örnek: vegan-iskender-tarifi → vitavegantis.com/vegan-iskender-tarifi/"
      - { name: image, label: Tarif fotoğrafı, widget: image }

      - { name: title, label: Başlık, widget: string }
      - { name: teaser, label: Kısa tanıtım, widget: text }
      - { name: time, label: Süre, widget: string, hint: "Örnek: 25 dk" }
      - { name: servings, label: Porsiyon, widget: string, hint: "Örnek: 2 kişilik" }
      - name: ingredients
        label: Malzemeler
        widget: list
        field: { name: item, label: Malzeme, widget: string }
      - name: steps
        label: Hazırlanışı
        widget: list
        field: { name: item, label: Adım, widget: string }

      - { name: titleEn, label: Başlık (EN), widget: string }
      - { name: teaserEn, label: Kısa tanıtım (EN), widget: text }
      - { name: timeEn, label: Süre (EN), widget: string, hint: "Örnek: 25 min" }
      - { name: servingsEn, label: Porsiyon (EN), widget: string, hint: "Örnek: Serves 2" }
      - name: ingredientsEn
        label: Malzemeler (EN)
        widget: list
        field: { name: item, label: Ingredient, widget: string }
      - name: stepsEn
        label: Hazırlanışı (EN)
        widget: list
        field: { name: item, label: Step, widget: string }

      # --- Gruplu malzeme listesi -----------------------------------------
      # Doldurulursa yukarıdaki düz "Malzemeler" listeleri yerine bu kullanılır.
      - name: ingredientGroups
        label: Malzeme grupları
        widget: list
        required: false
        summary: "{{fields.label}}"
        hint: >-
          Malzemeleri ara başlıklara ayırmak için (ör. "Sos için" / "Hamur
          için"). Boş bırakırsanız düz liste kullanılır.
        fields:
          - { name: label, label: Grup başlığı, widget: string }
          - { name: labelEn, label: Grup başlığı (EN), widget: string }
          - name: items
            label: Malzemeler
            widget: list
            field: { name: item, label: Malzeme, widget: string }
          - name: itemsEn
            label: Malzemeler (EN)
            widget: list
            field: { name: item, label: Ingredient, widget: string }

      # --- Ek bölümler (püf noktaları, kullanım alanları) -------------------
      - name: extras
        label: Ek bölümler
        widget: list
        required: false
        summary: "{{fields.heading}}"
        hint: 'Hazırlanışın altına eklenir. Örnek: Püf Noktaları.'
        fields:
          - { name: heading, label: Bölüm başlığı, widget: string }
          - { name: headingEn, label: Bölüm başlığı (EN), widget: string }
          - name: items
            label: Maddeler
            widget: list
            field: { name: item, label: Madde, widget: text }
          - name: itemsEn
            label: Maddeler (EN)
            widget: list
            field: { name: item, label: Item, widget: text }

      # --- Çok tarifli sayfalar (ör. "3 farklı hot dog") ------------------
      # Alt tarif eklendiğinde yukarıdaki Malzemeler/Hazırlanışı listeleri
      # BOŞ bırakılır; sayfa alt tariflerin listelerini kullanır.
      - name: intro
        label: Giriş paragrafı
        widget: text
        required: false
        hint: Yalnızca alt tarifli sayfalarda görünür; başlığın altına gelir.
      - { name: introEn, label: Giriş paragrafı (EN), widget: text, required: false }
      - name: variants
        label: Alt tarifler
        widget: list
        required: false
        summary: "{{fields.title}}"
        hint: >-
          Aynı sayfada birden fazla tarif anlatmak için kullanın. Boş
          bırakırsanız sayfa tek tarif olarak görünür.
        fields:
          - { name: title, label: Alt tarif başlığı, widget: string }
          - { name: titleEn, label: Alt tarif başlığı (EN), widget: string }
          - { name: teaser, label: Kısa tanıtım, widget: text }
          - { name: teaserEn, label: Kısa tanıtım (EN), widget: text }
          - { name: image, label: Fotoğraf, widget: image }
          - name: ingredients
            label: Malzemeler
            widget: list
            field: { name: item, label: Malzeme, widget: string }
          - name: ingredientsEn
            label: Malzemeler (EN)
            widget: list
            field: { name: item, label: Ingredient, widget: string }
          - name: steps
            label: Hazırlanışı
            widget: list
            field: { name: item, label: Adım, widget: string }
          - name: stepsEn
            label: Hazırlanışı (EN)
            widget: list
            field: { name: item, label: Step, widget: string }
      - name: closing
        label: Kapanış metni
        widget: text
        required: false
        hint: Sonuna satış noktaları bağlantısı otomatik eklenir.
      - { name: closingEn, label: Kapanış metni (EN), widget: text, required: false }

      # --- Arama motoru ---------------------------------------------------
      - name: metaDescription
        label: Arama sonucu açıklaması
        widget: text
        required: false
        hint: >-
          Google'da başlığın altında görünen metin. Boş bırakılırsa kısa
          tanıtım kullanılır. 150-160 karakter idealdir.
      - { name: metaDescriptionEn, label: Arama sonucu açıklaması (EN), widget: text, required: false }
      - name: keywords
        label: Anahtar kelimeler
        widget: string
        required: false
        hint: Virgülle ayırın. Tarif şemasına işlenir.
      - name: prepTimeIso
        label: Hazırlık süresi (şema)
        widget: string
        required: false
        pattern: ['^PT([0-9]+H)?([0-9]+M)?$', 'Örnek: PT20M ya da PT1H30M']
        hint: >-
          Yalnızca "Süre" alanı düz bir sayı değilse doldurun (ör. "20 dk +
          3 saat soğutma"). ISO biçimi: PT20M, PT1H30M.
      - name: totalTimeIso
        label: Toplam süre (şema)
        widget: string
        required: false
        pattern: ['^PT([0-9]+H)?([0-9]+M)?$', 'Örnek: PT3H20M']
        hint: Bekleme/soğutma dahil toplam süre. Boşsa "Süre" alanından okunur.
      - name: yieldCount
        label: Porsiyon sayısı (şema)
        widget: string
        required: false
        hint: >-
          Yalnızca "Porsiyon" alanı düz bir sayıyla başlamıyorsa doldurun
          (ör. "~600 g (20 dilim)" → 20).

  # --------------------------------------------------------- Sizden Gelenler
  - name: testimonials
    label: Sizden Gelenler
    files:
      - name: list
        label: Instagram Gönderileri
        file: src/content/testimonials.json
        media_folder: /public/testimonials
        public_folder: /testimonials
        description: >-
          Ana sayfada soldan sağa akan gönderi kartları. Kartta yalnızca
          fotoğraf görünür; yorum, kullanıcı adı ve beğeni sayısı gösterilmez.
          Sıralamayı sürükleyerek değiştirebilirsiniz.
        fields:
          - name: items
            label: Gönderiler
            widget: list
            summary: "{{fields.image}}"
            fields:
              - name: image
                label: Gönderi görseli
                widget: image
                hint: >-
                  Dikey (4:5) kırpılır. En az 500x625 piksel yükleyin ki
                  kartta net görünsün.

  # ----------------------------------------------------------- Satış Noktaları
  - name: sales_points
    label: Satış Noktaları
    files:
      - name: list
        label: Satış Noktaları Listesi
        file: src/content/sales-points.json
        media_folder: /public/satisnoktalari
        public_folder: /satisnoktalari
        description: >-
          Kartlar bu listedeki sırayla görünür; sürükleyerek sıralayabilirsiniz.
          Bağlantı alanı boş bırakılırsa kart tıklanmaz.
        fields:
          - name: points
            label: Satış noktaları
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Adı, widget: string }
              - { name: logo, label: Logo, widget: image }
              - name: href
                label: Bağlantı
                widget: string
                required: false
                hint: Ürünlerimizin listelendiği sayfanın tam adresi.
